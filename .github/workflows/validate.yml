name: Validate static site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gadget.js
          node --check gadget-data.js
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f gadget.html
          test -f gadget.css
          test -f gadget.js
          test -f gadget-data.js
          test -f phones.html
          test -f gadget-news.html
          test -f phones/index.html
          test -f news/index.html
          grep -q 'id="productGrid"' index.html
          grep -Fq 'Team Gadget（Robot ver）' index.html
